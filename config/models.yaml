# Model registry + routing config (consumed by services/core inference module — feature 1).
# MLX repo IDs verified on the HF Hub (mlx-community, 2026-06). See architecture/model-serving.md.
# Cloud lane is Fireworks AI (heavy consolidation) + Anthropic Claude (reasoning/agent) — verified 2026-07-31.

idleTimeoutSeconds: 600        # unload local model after 10 min idle

routing:
  agentLocalTokenCap: 12000    # agent requests above this escalate to cloud
  localCtxSafe: 14000          # any request above this goes to cloud regardless
                               # (must fit the LOCAL ctxWindow 16384 minus ~2.4k
                               #  reply headroom — 24000 could never fire before overflow)
  ramFloorGB: 2                # below this headroom, a local pick downgrades to cloud
  agentLatencyBudgetMs: 8000   # agent loops expected to exceed this escalate to cloud
  cloudTaskProviders:          # D-04: which cloud provider serves each task class
    consolidation: fireworks
    reasoning: anthropic
    agent: anthropic
  defaultCloudProvider: fireworks  # escalation default for hints with no explicit entry above
  agentPreferCloud: true       # agent task class runs on its cloud provider BY DEFAULT (D-04 cost change)

models:
  - id: qwen-local-chat
    kind: chat
    provider: mlx
    modelRef: mlx-community/Qwen3-4B-Instruct-2507-4bit   # ~2.5GB @ 4-bit, fits the 16GB Air
    quant: 4bit
    ctxWindow: 16384
    approxRamGB: 6
    default: true

  - id: fireworks-heavy
    kind: chat
    provider: fireworks                                 # Fireworks AI serverless OpenAI-compatible endpoint
    modelRef: accounts/fireworks/models/qwen3-next-80b-a3b-instruct
    ctxWindow: 262144
    endpointUrl: ${FIREWORKS_ENDPOINT_URL}               # optional override; empty (uses built-in default) when unset
    default: true

  - id: anthropic-agent
    kind: chat
    provider: anthropic                                 # Anthropic Claude via its OpenAI-SDK-compatible endpoint
    modelRef: claude-sonnet-5
    ctxWindow: 1000000
    endpointUrl: ${ANTHROPIC_ENDPOINT_URL}                # optional override; empty (uses built-in default) when unset
    default: true

  - id: qwen-embed
    kind: embedding
    provider: mlx
    modelRef: mlx-community/Qwen3-Embedding-0.6B-8bit   # ~0.6GB, 8-bit (retrieval is precision-sensitive)
    default: true
