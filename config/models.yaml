# Model registry + routing config (consumed by services/core inference module — feature 1).
# MLX repo IDs verified on the HF Hub (mlx-community, 2026-06). See architecture/model-serving.md.

idleTimeoutSeconds: 600        # unload local model after 10 min idle

routing:
  agentLocalTokenCap: 12000    # agent requests above this escalate to HF
  localCtxSafe: 14000          # any request above this goes to HF regardless
                               # (must fit the LOCAL ctxWindow 16384 minus ~2.4k
                               #  reply headroom — 24000 could never fire before overflow)

models:
  - id: qwen-local-chat
    kind: chat
    provider: mlx
    modelRef: mlx-community/Qwen3-4B-Instruct-2507-4bit   # ~2.5GB @ 4-bit, fits the 16GB Air
    quant: 4bit
    ctxWindow: 16384
    approxRamGB: 6
    default: true

  - id: openai-heavy
    kind: chat
    provider: hf                                       # "hf" = the OpenAI-compatible cloud provider slot (Bearer ${HF_TOKEN} → ${HF_ENDPOINT_URL})
    modelRef: gpt-5-mini                               # OpenAI API (switched from HF Inference Providers 2026-07-04; needs an OpenAI API key with credits — ChatGPT Plus is separate)
    # Supports tool-calling + streaming via the same OpenAI-compatible /v1/chat/completions contract.
    ctxWindow: 400000                                  # gpt-5-mini context window
    endpointUrl: ${HF_ENDPOINT_URL}                    # set to https://api.openai.com/v1/chat/completions in .env; HF_TOKEN holds the OpenAI key (legacy var names)

  - id: qwen-embed
    kind: embedding
    provider: mlx
    modelRef: mlx-community/Qwen3-Embedding-0.6B-8bit   # ~0.6GB, 8-bit (retrieval is precision-sensitive)
    default: true
